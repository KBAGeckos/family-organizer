<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Profiles – FamCal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/weather.css">
<style>
.profiles-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
}
.profile-card {
  background: rgba(10,18,40,0.82);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.profile-avatar-wrap {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
}
.profile-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
.profile-avatar-initials {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 800;
  color: white;
}
.avatar-edit-badge {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #6366f1;
  border: 2px solid #0f172a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  pointer-events: none;
}
.profile-info {
  flex: 1;
  min-width: 0;
}
.profile-name {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: #fff;
  margin-bottom: 4px;
}
.profile-color-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.color-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.selected { border-color: white; transform: scale(1.1); }
.profile-photo-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  flex-shrink: 0;
}
.photo-btn {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'Nunito Sans', sans-serif;
  transition: background 0.15s;
  white-space: nowrap;
}
.photo-btn.upload {
  background: #6366f1;
  color: white;
}
.photo-btn.upload:hover { background: #4f46e5; }
.photo-btn.remove {
  background: rgba(244,63,94,0.15);
  color: #f43f5e;
}
.photo-btn.remove:hover { background: rgba(244,63,94,0.28); }
.hidden-input { display: none; }
.tip-card {
  background: rgba(99,102,241,0.12);
  border: 1px solid rgba(99,102,241,0.25);
  border-radius: 14px;
  padding: 12px 16px;
  margin: 0 14px 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  line-height: 1.6;
}
.tip-card strong { color: #a5b4fc; }
.success-toast {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #16a34a;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
.success-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body class="weather-partly-cloudy">
<div id="weather-bg" class="weather-bg">
  <div class="weather-layer" id="weather-layer"></div>
  <div class="weather-overlay"></div>
</div>

<header class="page-header">
  <a href="../index.html" class="back-btn">‹</a>
  <div class="page-title">👤 Family Profiles</div>
</header>

<div class="tip-card">
  <strong>Tap the camera badge</strong> on any avatar to upload a photo from your phone or computer. Photos are saved on this device.
</div>

<div class="profiles-grid" id="profiles-grid"></div>

<div class="success-toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/weather.js"></script>
<script>
setWeatherBg('partly-cloudy', true);

const COLOR_OPTIONS = [
  '#16a34a','#0d9488','#2563eb','#7c3aed','#374151',
  '#e11d48','#ea580c','#ca8a04','#0891b2','#9333ea',
  '#be185d','#15803d','#1d4ed8','#6366f1','#64748b',
];

function renderProfiles() {
  const grid = document.getElementById('profiles-grid');
  grid.innerHTML = '';

  FAMILY_MEMBERS.filter(m => m.id !== 'family').forEach(m => {
    const photo = AvatarStore.getPhoto(m.id);

    const card = document.createElement('div');
    card.className = 'profile-card';

    // Avatar area
    const avatarWrap = document.createElement('div');
    avatarWrap.className = 'profile-avatar-wrap';
    avatarWrap.title = 'Tap to change photo';
    avatarWrap.onclick = () => document.getElementById('file-' + m.id).click();

    if (photo) {
      const img = document.createElement('img');
      img.className = 'profile-avatar';
      img.src = photo;
      img.alt = m.name;
      avatarWrap.appendChild(img);
    } else {
      const initDiv = document.createElement('div');
      initDiv.className = 'profile-avatar-initials';
      initDiv.style.background = m.color;
      initDiv.textContent = m.initials;
      avatarWrap.appendChild(initDiv);
    }

    const badge = document.createElement('div');
    badge.className = 'avatar-edit-badge';
    badge.textContent = '📷';
    avatarWrap.appendChild(badge);

    // Hidden file input
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.id = 'file-' + m.id;
    fileInput.className = 'hidden-input';
    fileInput.onchange = (e) => handlePhotoUpload(e, m.id);
    avatarWrap.appendChild(fileInput);

    // Info area
    const info = document.createElement('div');
    info.className = 'profile-info';

    const nameDiv = document.createElement('div');
    nameDiv.className = 'profile-name';
    nameDiv.textContent = m.name;
    info.appendChild(nameDiv);

    // Color picker row
    const colorRow = document.createElement('div');
    colorRow.className = 'profile-color-row';

    const colorLabel = document.createElement('div');
    colorLabel.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.4);font-weight:700;margin-right:2px;width:100%';
    colorLabel.textContent = 'Color theme:';
    colorRow.appendChild(colorLabel);

    COLOR_OPTIONS.forEach(clr => {
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (m.color === clr ? ' selected' : '');
      dot.style.background = clr;
      dot.title = clr;
      dot.onclick = () => changeColor(m.id, clr);
      colorRow.appendChild(dot);
    });

    info.appendChild(colorRow);

    // Action buttons
    const actions = document.createElement('div');
    actions.className = 'profile-photo-actions';

    const uploadBtn = document.createElement('button');
    uploadBtn.className = 'photo-btn upload';
    uploadBtn.textContent = photo ? '📷 Change' : '📷 Add Photo';
    uploadBtn.onclick = () => document.getElementById('file-' + m.id).click();
    actions.appendChild(uploadBtn);

    if (photo) {
      const removeBtn = document.createElement('button');
      removeBtn.className = 'photo-btn remove';
      removeBtn.textContent = '✕ Remove';
      removeBtn.onclick = () => removePhoto(m.id);
      actions.appendChild(removeBtn);
    }

    card.appendChild(avatarWrap);
    card.appendChild(info);
    card.appendChild(actions);
    grid.appendChild(card);
  });
}

function handlePhotoUpload(e, memberId) {
  const file = e.target.files[0];
  if (!file) return;

  // Validate it's an image
  if (!file.type.startsWith('image/')) {
    showToast('Please select an image file');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(evt) {
    // Resize to reasonable dimensions before saving to avoid quota issues
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 300; // 300x300 max, plenty for avatars
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
      else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      // Crop to square from center
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const ok = AvatarStore.savePhoto(memberId, dataUrl);
      if (ok) {
        showToast('✓ Photo saved!');
        renderProfiles();
      } else {
        showToast('Storage full — try a smaller image');
      }
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
  // Reset input so same file can be re-selected
  e.target.value = '';
}

function removePhoto(memberId) {
  AvatarStore.deletePhoto(memberId);
  showToast('Photo removed');
  renderProfiles();
}

function changeColor(memberId, newColor) {
  const member = FAMILY_MEMBERS.find(m => m.id === memberId);
  if (member) {
    member.color = newColor;
    // Persist color override
    const overrides = JSON.parse(localStorage.getItem('fc_color_overrides') || '{}');
    overrides[memberId] = newColor;
    localStorage.setItem('fc_color_overrides', JSON.stringify(overrides));
    showToast('✓ Color updated!');
    renderProfiles();
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

// Apply any saved color overrides on load
const colorOverrides = JSON.parse(localStorage.getItem('fc_color_overrides') || '{}');
FAMILY_MEMBERS.forEach(m => {
  if (colorOverrides[m.id]) m.color = colorOverrides[m.id];
});

renderProfiles();
</script>
</body>
</html>
