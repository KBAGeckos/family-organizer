<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shopping – FamCal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/weather.css">
<style>
  .category-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); padding: 4px 10px 2px; text-transform: uppercase; }
  .clear-btn { font-size: 12px; color: #f43f5e; padding: 4px 10px; background: rgba(244,63,94,0.12); border-radius: 8px; }
  .item-delete { font-size: 15px; color: rgba(255,255,255,0.2); padding: 4px 6px; transition: color 0.15s; }
  .item-delete:hover { color: #f43f5e; }
</style>
</head>
<body class="weather-partly-cloudy">
<div id="weather-bg" class="weather-bg"><div class="weather-layer" id="weather-layer"></div><div class="weather-overlay"></div></div>

<header class="page-header">
  <a href="../index.html" class="back-btn">‹</a>
  <div class="page-title">🛒 Shopping List</div>
</header>

<div class="list-section" id="list-section"></div>

<script src="../js/data.js"></script>
<script src="../js/weather.js"></script>
<script>
setWeatherBg('partly-cloudy', true);

function render() {
  const items = Store.getShoppingList();
  const unchecked = items.filter(i => !i.checked);
  const checked = items.filter(i => i.checked);
  const section = document.getElementById('list-section');

  let html = `<div class="list-card">
    <div class="list-card-header">
      <div class="list-card-title">Items (${unchecked.length} remaining)</div>
      ${checked.length > 0 ? `<button class="clear-btn" onclick="clearChecked()">Clear done</button>` : ''}
    </div>
    <div class="list-items" id="items-container">`;

  if (unchecked.length === 0 && checked.length === 0) {
    html += '<div class="no-events" style="padding:20px">No items yet — add some below!</div>';
  }

  unchecked.forEach(item => {
    html += itemHtml(item);
  });

  if (checked.length > 0) {
    html += `<div class="category-label" style="margin-top:8px">Checked off</div>`;
    checked.forEach(item => { html += itemHtml(item); });
  }

  html += `</div>
    <div class="add-item-row">
      <input type="text" id="new-item" class="add-item-input" placeholder="Add item..." onkeydown="if(event.key==='Enter')addItem()">
      <button class="add-item-btn" onclick="addItem()">+</button>
    </div>
  </div>`;

  section.innerHTML = html;
}

function itemHtml(item) {
  return `<div class="list-item ${item.checked ? 'checked' : ''}" onclick="toggle('${item.id}')">
    <div class="list-check">${item.checked ? '✓' : ''}</div>
    <div class="list-item-text">${item.text}</div>
    <button class="item-delete" onclick="event.stopPropagation();del('${item.id}')">✕</button>
  </div>`;
}

function addItem() {
  const inp = document.getElementById('new-item');
  const text = inp.value.trim();
  if (!text) return;
  Store.addShoppingItem(text);
  inp.value = '';
  render();
}

function toggle(id) { Store.toggleShoppingItem(id); render(); }
function del(id) { Store.deleteShoppingItem(id); render(); }
function clearChecked() {
  Store.getShoppingList().filter(i => i.checked).forEach(i => Store.deleteShoppingItem(i.id));
  render();
}

render();
</script>
</body>
</html>
